<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vía Moreno - Pasajes de Micro</title>
    <style>
        :root {
            --primary-red: #e31b23;
            --dark-blue: #0b1d3a;
            --light-bg: #f4f5f7;
            --gray-border: #ccd0d5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: #333;
        }

        /* Header superior */
        header {
            background-color: var(--primary-red);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container h1 {
            font-size: 24px;
            font-style: italic;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .currency-lang {
            font-size: 14px;
            font-weight: bold;
        }

        /* Sección de Banner e Imagen Personalizable */
        .banner-section {
            background: white;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid var(--gray-border);
        }

        .banner-upload-box {
            border: 2px dashed var(--primary-red);
            padding: 20px;
            border-radius: 8px;
            background: #fff5f5;
            margin-bottom: 10px;
        }

        .banner-upload-box img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 6px;
            display: none;
            margin-top: 10px;
        }

        .banner-upload-box input[type="file"] {
            margin-top: 10px;
        }

        /* Formulario de Buscador */
        .search-container {
            background: white;
            margin: 15px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #444;
            margin-bottom: 6px;
        }

        select, input[type="date"], input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--gray-border);
            border-radius: 8px;
            font-size: 15px;
            background: #fff;
        }

        .trip-type {
            display: flex;
            gap: 20px;
            margin: 15px 0;
            font-size: 14px;
            font-weight: bold;
        }

        .trip-type label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .btn-buscar {
            background-color: var(--primary-red);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-buscar:hover {
            background-color: #c2131b;
        }

        /* Resultados de la búsqueda */
        .results-container {
            margin: 15px;
        }

        .result-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-info h3 {
            font-size: 16px;
            color: var(--dark-blue);
            margin-bottom: 5px;
        }

        .result-info p {
            font-size: 14px;
            color: #666;
        }

        .result-price {
            text-align: right;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary-red);
            display: block;
            margin-bottom: 5px;
        }

        .btn-seleccionar {
            background: var(--dark-blue);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }

        /* Footer */
        footer {
            background-color: var(--primary-red);
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-container">
            <h1>VÍA MORENO</h1>
        </div>
        <div class="currency-lang">
            ARS 🇦🇷
        </div>
    </header>

    <!-- Sección de Imagen de Micro (Personalizable) -->
    <div class="banner-section">
        <div class="banner-upload-box">
            <p><strong>Panel de Personalización:</strong> Sube aquí la imagen de tu micro para la portada</p>
            <input type="file" id="uploadMicro" accept="image/*" onchange="cargarImagenMicro(event)">
            <br>
            <img id="imagenPrevia" alt="Vista previa del micro">
        </div>
    </div>

    <!-- Buscador de Pasajes -->
    <div class="search-container">
        <div class="form-row">
            <div class="form-group">
                <label for="origen">Origen</label>
                <select id="origen">
                    <option value="Buenos Aires">Buenos Aires (Retiro)</option>
                    <option value="La Plata">La Plata</option>
                    <option value="Rosario">Rosario</option>
                    <option value="Córdoba">Córdoba</option>
                </select>
            </div>
            <div class="form-group">
                <label for="destino">Destino</label>
                <select id="destino">
                    <option value="Mar del Plata">Mar del Plata</option>
                    <option value="Bariloche">San Carlos de Bariloche</option>
                    <option value="Mendoza">Mendoza</option>
                    <option value="Córdoba">Córdoba</option>
                    <option value="Iguazú">Puerto Iguazú</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="fechaIda">Fecha de Ida</label>
                <input type="date" id="fechaIda">
            </div>
            <div class="form-group" id="groupFechaVuelta">
                <label for="fechaVuelta">Fecha de Vuelta</label>
                <input type="date" id="fechaVuelta">
            </div>
        </div>

        <div class="trip-type">
            <label><input type="radio" name="tipoViaje" value="idaVuelta" checked onclick="toggleVuelta(true)"> Ida y vuelta</label>
            <label><input type="radio" name="tipoViaje" value="soloIda" onclick="toggleVuelta(false)"> Sólo ida</label>
        </div>

        <div class="form-group">
            <label for="pasajeros">Pasajeros</label>
            <select id="pasajeros">
                <option value="1">1 Pasajero (Semi-cama)</option>
                <option value="2">2 Pasajeros (Cama)</option>
                <option value="3">3 Pasajeros</option>
                <option value="4">4 Pasajeros</option>
            </select>
        </div>

        <button class="btn-buscar" onclick="buscarPasajes()">BUSCAR PASAJES</button>
    </div>

    <!-- Resultados -->
    <div class="results-container" id="resultados">
        <!-- Los resultados dinámicos se cargarán aquí -->
    </div>

    <!-- Footer -->
    <footer>
        <p>Vía Moreno - Todos los derechos reservados © 2026</p>
        <p>consultas@viamoreno.com.ar</p>
    </footer>

    <!-- JavaScript Funcional -->
    <script>
        // Establecer la fecha actual por defecto en el input de ida
        document.getElementById('fechaIda').valueAsDate = new Date();

        // Función para mostrar u ocultar el campo de fecha de vuelta
        function toggleVuelta(mostrar) {
            const groupVuelta = document.getElementById('groupFechaVuelta');
            groupVuelta.style.display = mostrar ? 'block' : 'none';
        }

        // Función para subir y previsualizar la imagen del micro
        function cargarImagenMicro(event) {
            const archivo = event.target.files[0];
            if (archivo) {
                const lector = new FileReader();
                lector.onload = function(e) {
                    const img = document.getElementById('imagenPrevia');
                    img.src = e.target.result;
                    img.style.display = 'block';
                }
                lector.readAsDataURL(archivo);
            }
        }

        // Base de datos simulada con precios reales aproximados en ARS para destinos de Argentina
        const tarifasBase = {
            "Mar del Plata": 35000,
            "Bariloche": 125000,
            "Mendoza": 85000,
            "Córdoba": 48000,
            "Iguazú": 110000
        };

        function buscarPasajes() {
            const origen = document.getElementById('origen').value;
            const destino = document.getElementById('destino').value;
            const pasajeros = parseInt(document.getElementById('pasajeros').value);
            const tipoViaje = document.querySelector('anim input[name="tipoViaje"]:checked') || document.querySelector('input[name="tipoViaje"]:checked').value;
            
            const contenedorResultados = document.getElementById('resultados');
            contenedorResultados.innerHTML = "";

            // Calcular precio base según destino
            let precioUnitario = tarifasBase[destino] || 50000;
            if (tipoViaje === 'idaVuelta') {
                precioUnitario *= 1.8; // Descuento leve por ida y vuelta
            }

            const precioTotal = precioUnitario * pasajeros;

            // Generar opciones de horarios simulados
            const horarios = [
                { empresa: "Vía Moreno - Ejecutivo", horaSalida: "08:00 Hs", servicio: "Semicama / Cama" },
                { empresa: "Vía Moreno - Directo", horaSalida: "14:30 Hs", servicio: "Cama Total" },
                { empresa: "Vía Moreno - Nocturno", horaSalida: "22:00 Hs", servicio: "Suite / Cama" }
            ];

            let htmlResultados = `<h2 style="font-size: 18px; margin-bottom: 10px; color: #0b1d3a;">Resultados para: ${origen} ➔ ${destino}</h2>`;

            horarios.forEach((h, index) => {
                // Variar ligeramente el precio por servicio
                const precioFinalServicio = Math.round(precioTotal * (1 + (index * 0.1)));
                
                htmlResultados += `
                    <div class="result-card">
                        <div class="result-info">
                            <h3>${h.empresa}</h3>
                            <p>Salida: <strong>${h.horaSalida}</strong> | ${h.servicio}</p>
                            <p>${pasajeros} pasajero(s) - ${tipoViaje === 'idaVuelta' ? 'Ida y Vuelta' : 'Sólo Ida'}</p>
                        </div>
                        <div class="result-price">
                            <span class="price">$ ${precioFinalServicio.toLocaleString('es-AR')}</span>
                            <button class="btn-seleccionar" onclick="alert('¡Asiento seleccionado con éxito en Vía Moreno! Redirigiendo al pago...')">Seleccionar</button>
                        </div>
                    </div>
                `;
            });

            contenedorResultados.innerHTML = htmlResultados;
        }
    </script>
</body>
</html>
